# Herdr keybindings aligned with ~/.tmux.conf.
onboarding = false

[ui]
agent_panel_sort = "spaces"
sidebar_start_collapsed = false
# Show the Herdr server's hostname in the top-right tab bar.
tab_bar_position = "top"
tab_bar_right = [{ type = "hostname" }]
tab_bar_right_separator = "  ·  "

[keys]
# Keep tmux's default prefix.
prefix = "ctrl+b"

# tmux session/window navigation equivalents.
workspace_picker = "prefix+s"
new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
# Assign visible 1..9 numbers to spaces and switch with prefix+shift+1..9.
switch_workspace = "prefix+shift+1..9"
# Vim-style movement while the space/workspace navigator is open (prefix+s).
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# Pane navigation and resizing are handled by smart-splits.nvim.
# Keep the built-in bindings empty so the plugin actions receive these keys.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# Herdr's reliable split shortcuts: prefix+v (side-by-side) and prefix+- (stacked).
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"

# tmux pane controls.
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"

# tmux copy-mode entry; Herdr's copy mode uses vi movement.
copy_mode = "prefix+["

# Keep Herdr's useful prefix bindings explicit.
reload_config = "prefix+shift+r"
edit_scrollback = "prefix+e"
toggle_sidebar = "prefix+b"

# smart-splits.nvim bridges Neovim splits and Herdr/Kitty/tmux panes.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "Navigate left (Neovim/Herdr/Kitty/tmux)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "Navigate down (Neovim/Herdr/Kitty/tmux)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "Navigate up (Neovim/Herdr/Kitty/tmux)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "Navigate right (Neovim/Herdr/Kitty/tmux)"

# Keep resize forwarding on the Herdr side. The helper forwards Alt+h/j/k/l
# into Neovim when the focused Herdr pane contains Neovim; otherwise it resizes
# the Herdr pane directly via herdr-splits plugin.
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "Resize left (Neovim/Herdr/Kitty/tmux)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "Resize down (Neovim/Herdr/Kitty/tmux)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "Resize up (Neovim/Herdr/Kitty/tmux)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "Resize right (Neovim/Herdr/Kitty/tmux)"
