include ./nord_theme.conf
font_family      family="JetBrainsMonoNL Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13
background_opacity 0.9
enable_audio_bell no
scrollback_lines 3000
allow_remote_control yes
listen_on unix:/tmp/kitty
# Pane navigation and resizing are handled by Herdr when running inside Herdr.
action_alias kitty_scrollback_nvim kitten /home/rpamirov/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
map kitty_mod+f kitty_scrollback_nvim
map kitty_mod+h kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output


# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME
